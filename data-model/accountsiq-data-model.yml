note: 'Derived from the XSD embedded in the SOAP contract. The WSDL declares 280 complex types; the entities below
  are the accounting core. Relationships are read from element types (a tns: element type is a composition edge,
  an ArrayOf<T> is a collection edge) and from id-reference field naming (FooCode / FooID pointing at entity Foo).
  Nothing here is inferred from prose.'
complex_type_count: 280
tenancy:
  root: Customer
  description: 'AccountsIQ hierarchy above the accounting entities, as defined in the provider glossary: a Customer
    is a practice or franchisor that groups Entities; an Entity is a client company. The API reads entity-level
    data only and cannot reach customer/practice-level data.'
  source: https://accountsiq.github.io/API-Wiki/a-z.html
concurrency_field:
  name: RowVersionNumber
  description: Opaque optimistic-concurrency token present on most mutable entities. Must be echoed back from the
    retrieved object on update; a stale value raises OUTDATED_RECORD.
correlation_field:
  name: ExternalReference
  description: Caller-supplied key carried on invoices, orders, credit notes and transactions, readable back via
    the GetXByExternalReference family.
transaction_types:
  note: Closed set of ledger transaction type codes published in the provider glossary.
  source: https://accountsiq.github.io/API-Wiki/a-z.html
  codes:
  - code: BC
    meaning: Bank Credit Journal
  - code: BD
    meaning: Bank Debit Journal
  - code: BP
