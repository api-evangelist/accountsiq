    meaning: Sales Debit Journal
  - code: SI
    meaning: Sales Invoice
  - code: SN
    meaning: Sales Credit Note
  - code: SR
    meaning: Sales Receipt
invoice_variants:
  note: The provider glossary distinguishes three invoice shapes, which is why several parallel Create/Save/Post
    families exist in the contract.
  source: https://accountsiq.github.io/API-Wiki/a-z.html
  variants:
  - name: Batch Invoice
    description: Lines hold no stock-item reference; posted directly to the transactions table with no stock movement.
  - name: Product Invoice
    description: Every line references an item; supports stock movement and must be posted to hit the transaction
      journal.
  - name: Service Invoice
    description: Lines reference services or non-stock items; supports a pro-forma workflow and can be checked before
      posting to the ledger.
