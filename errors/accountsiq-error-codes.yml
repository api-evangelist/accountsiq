documented_remediation:
- area: Sales Receipt
  codes_hint: SALESRECEIPT_*
  remediation: Mandatory variables BankAccountCode, CheckReference and CustomerCode must all be supplied.
  source: https://accountsiq.github.io/API-Wiki/troubleshooting.html
- area: Sales Order
  codes_hint: ORDER_*
  remediation: AuthorUserID, CreationDate, QuoteID and Status must be null (xsi:nil="true", not the string
    "N/A"); CurrencyCode and OrderDate are mandatory; Hold must be 0; OrderID blank; do not set RowVersionNumber.
  source: https://accountsiq.github.io/API-Wiki/troubleshooting.html
- area: Customer create
  codes_hint: CUSTOMER_*
  remediation: Customer code is mandatory and must be UPPER CASE (the system does not generate codes);
    BankCode must already exist as a General Ledger code; referral ID must be left null. Use GetNewCustomerFromDefaults
    to obtain a pre-populated shell.
  source: https://accountsiq.github.io/API-Wiki/troubleshooting.html
- area: Optimistic concurrency
  codes_hint: OUTDATED_RECORD
  remediation: 'Re-save the retrieved object, not the original: RowVersionNumber is set during save and
    a stale value fails the update.'
  source: https://accountsiq.github.io/API-Wiki/troubleshooting.html
- area: Authentication
  codes_hint: HasExpired flag
  remediation: Session token on 1.1 is valid 20 minutes; when HasExpired is returned call Login again.
    On 2.0 call TokenRefresh with the refresh token.
  source: https://accountsiq.github.io/API-Wiki/authentication1.html
