apis:
- aid: accountsiq:integration-2-0
  name: AccountsIQ Integration API 2.0
  image: https://cdn.prod.website-files.com/6789021db7b1eb2a4e86ccba/68302f995f42ad33549c88c1_open-graph.png
  description: 'The current AIQ SOAP 1.1 integration web service. 219 operations covering
    customers, suppliers, stock items, sales and purchase invoices, credit and debit
    notes, orders, deliveries, general journals, bank transfers, payments and receipts,
    transaction allocation, budgets, the chart of accounts, trial balance, analysis
    dimensions, departments, projects, notes and document attachments. Authenticated
    with OAuth 2.0 client credentials via TokenGet/TokenRefresh; the access token and
    the target Entity are carried in the AiqSoapHeader.'
