aid: accountsiq
name: AccountsIQ
description: 'AccountsIQ is a cloud accounting and financial management platform for
  mid-sized businesses and multi-entity group structures, headquartered in Dublin, Ireland.
  The platform covers the general ledger, accounts receivable and payable, banking and
  bank-feed reconciliation, budgeting, cashflow forecasting, fixed assets, stock, sales
  and purchase order processing, multi-currency consolidation and business intelligence.
  Its public integration surface is the AIQ SOAP API, published as two WSDL contracts —
  Integration 1.1 (session-token Login authentication) and Integration 2.0 (OAuth 2.0
  client-credentials via TokenGet/TokenRefresh) — served from four regional deployments
  (eu1, eu2, uk1, us1) and documented in the openly published AccountsIQ API Wiki, with
  first-party Postman collections for every region and version.'
