oauth_metadata:
  found: false
  note: 'Worth noting explicitly because AccountsIQ does implement an OAuth 2.0 client-credentials grant on
    Integration 2.0. It publishes no RFC 8414 authorization-server metadata and no RFC 9728 protected-resource
    metadata, so the grant is not machine-discoverable: a client must read the human documentation to learn
    that TokenGet exists. See authentication/accountsiq-authentication.yml.'
