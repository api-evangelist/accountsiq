status: candidate
name: accountsiq
note: AccountsIQ ships NO MCP server. Searches of the provider site, the API Wiki, the AccountsIQ GitHub organisation
  (one public repo, API-Wiki), npm and PyPI found no hosted endpoint and no stdio package, and the llms.txt
  AccountsIQ publishes at accountsiq.com/llms.txt points only at marketing and help pages - it names no MCP
  surface. The tool list below is a CANDIDATE derived by grouping the real WSDL operations into agent-shaped
  tasks. It is a proposal for AccountsIQ, not a description of something callable today. Every operation named
  in backing_operations was grepped from the contract and exists; no endpoint URL is invented. Because it is
  a candidate, apis.yml points at this file with type X-MCPServerCandidate and NOT with type MCPServer.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: oauth
  verified: searched
  auth_note: 'If AccountsIQ were to build this, the auth model already exists: OAuth 2.0 client-credentials
    via TokenGet/TokenRefresh, with the target Entity carried alongside the access token. GetEntitiesByToken
    makes entity selection discoverable, which is the hard part of a multi-tenant MCP server and is already
    solved in the contract.'
transport_note: 'An MCP server here would be a translation layer, not a thin proxy: MCP speaks JSON-RPC over
  HTTP/stdio and AccountsIQ speaks SOAP 1.1 with XML envelopes, so the server would own envelope construction,
  the AiqSoapHeader, and unwrapping the WSResult2Of<T> result (which reports errors in-band on a 200, not as
  a fault).'
agent_hazards:
- No idempotency. A retried create_sales_invoice posts a second invoice. An MCP server would need to implement
  deduplication itself, most plausibly on the ExternalReference field.
- Errors arrive on the success envelope. A naive proxy that checks only HTTP status will report every failure
  as a success with a null result.
- Writes are financial. create_sales_invoice, post_journal, record_payment and allocate_transactions change
  a ledger; consequence is recorded per tool so a server can gate them behind confirmation.
- Deletes are unrecoverable. DeleteCustomerById has no published restore path, which is why no delete tool
  is proposed above.
