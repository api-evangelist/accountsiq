  entitlement, not a universal one — but no price is asserted here because none is published.
api_access_is_tiered: true
api_access_note: >-
  This is the commercially significant fact on the page. The API Wiki states "All AIQ editions
  have access to our API without restriction", which is a statement about technical
  availability; the pricing page gates it commercially. Core lists no API access, Growth
  includes self-service integration, and Scale includes AIQ-managed integration. An integrator
  should confirm the customer's tier before assuming API entitlement.
