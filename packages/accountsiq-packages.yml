note: >-
  AccountsIQ publishes no client libraries, and says so in its own words: "Currently, we do not
  offer client libraries." This is a stated position, not a gap we failed to find, which is why
  the count is an affirmative zero. It is also idiomatic for the technology — the documented
  integration path for a SOAP 1.1 service is to generate a typed proxy from the WSDL at build
  time, so the contract fills the role a package would fill in a REST API. What AccountsIQ
  offers in place of packages is a Postman collection per region and version, and a sample C#
  project available on request.
